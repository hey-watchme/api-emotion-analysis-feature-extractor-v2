version: '3.8'

services:
  emotion-analysis-feature-extractor:
    image: 754724220380.dkr.ecr.ap-southeast-2.amazonaws.com/watchme-emotion-analysis-feature-extractor:latest
    container_name: emotion-analysis-feature-extractor
    ports:
      - "127.0.0.1:8018:8018"
    env_file:
      - .env
    environment:
      - FEATURE_COMPLETED_QUEUE_URL=${FEATURE_COMPLETED_QUEUE_URL:-https://sqs.ap-southeast-2.amazonaws.com/754724220380/watchme-feature-completed-queue}
      - SER_JOB_QUEUE_ENABLED=${SER_JOB_QUEUE_ENABLED:-true}
      - SER_JOB_QUEUE_URL=${SER_JOB_QUEUE_URL:-https://sqs.ap-southeast-2.amazonaws.com/754724220380/watchme-ser-job-queue-v1.fifo}
      - SER_JOB_QUEUE_WAIT_SECONDS=${SER_JOB_QUEUE_WAIT_SECONDS:-20}
      - SER_JOB_QUEUE_VISIBILITY_TIMEOUT=${SER_JOB_QUEUE_VISIBILITY_TIMEOUT:-600}
      - SER_ALLOW_IN_PROCESS_FALLBACK=${SER_ALLOW_IN_PROCESS_FALLBACK:-false}
    networks:
      - watchme-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8018/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # 初回デプロイはモデルロードに約40秒かかる
    deploy:
      resources:
        limits:
          memory: 1500M  # Kushinadaモデルのメモリ要件（サーバースペック内）
          cpus: '1.0'

networks:
  watchme-network:
    external: true
